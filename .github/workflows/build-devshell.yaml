name: Build Developer Shell and upload to Cachix
concurrency: build-devshell

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-devshell.yaml"
      - "modules/devshell.nix"

jobs:
  build-devshell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: wimpysworld/nothing-but-nix@main

      - name: "Install Nix ❄️"
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: "Setup Cachix"
        uses: cachix/cachix-action@v17
        with:
          name: ell-nixos-config
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: "Build Developer Shell ❄️"
        shell: bash
        run: |
          set -euo pipefail
          nix build .#devShells.x86_64-linux.default --show-trace
          if [ -e result ]; then
            cachix push ell-nixos-config $(readlink result)
          fi
