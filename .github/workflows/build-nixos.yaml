name: Build NixOS and upload to Cachix
concurrency: build-nixos

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build-nixos.yaml"
      - "!modules/formatter.nix"
      - "!modules/devshell.nix"

jobs:
  build-winpooter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: wimpysworld/nothing-but-nix@main

      - name: "Install Nix ❄️"
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: "Setup Cachix"
        uses: cachix/cachix-action@v17
        with:
          name: ell-nixos-config
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: "Magic Nix Cache"
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: "Build NixOS config ❄️"
        shell: bash
        run: |
          set -euo pipefail
          nix build .#nixosConfigurations.winpooter.config.system.build.toplevel --show-trace
          if [ -e result ]; then
            cachix push ell-nixos-config $(readlink result)
          fi
  build-umbreon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: wimpysworld/nothing-but-nix@main

      - name: "Install Nix ❄️"
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: "Setup Cachix"
        uses: cachix/cachix-action@v17
        with:
          name: ell-nixos-config
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: "Build NixOS config ❄️"
        shell: bash
        run: |
          set -euo pipefail
          nix build .#nixosConfigurations.umbreon.config.system.build.toplevel --show-trace
          if [ -e result ]; then
            cachix push ell-nixos-config $(readlink result)
          fi
