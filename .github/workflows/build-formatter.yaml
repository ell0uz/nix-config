name: Build Flake Formatter and upload to Cachix
concurrency: build-formatter

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-formatter.yaml"
      - "modules/formatter.nix"
      - "flake.nix"

jobs:
  build-winpooter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: wimpysworld/nothing-but-nix@main

      - name: "Install Nix ❄️"
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: "Setup Cachix"
        uses: cachix/cachix-action@v17
        with:
          name: ell-nixos-config
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: "Build Flake Formatter ❄️"
        shell: bash
        run: |
          set -euo pipefail
          nix build .#formatter
          if [ -e result ]; then
            cachix push ell-nixos-config $(readlink result)
          fi
